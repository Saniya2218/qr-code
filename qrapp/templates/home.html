<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script>
        // Function to automatically download the QR code
        function downloadQRCode(base64Data) {
            const a = document.createElement("a");
            a.href = "data:image/png;base64," + base64Data;
            a.download = "qr_code.png";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">QR Code Generator</h1>
        <form method="POST" class="form-group">
            {% csrf_token %}
            <div class="mb-3">
                <label for="url" class="form-label">Enter URL:</label>
                <input type="text" id="url" name="url" class="form-control" placeholder="Enter a URL" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Generate QR Code</button>
            </div>
        </form>

        {% if qr_image_data %}
        <div class="mt-5 text-center">
            <h4>Generated QR Code:</h4>
            <img src="data:image/png;base64,{{ qr_image_data }}" alt="QR Code" class="img-thumbnail">
            <script>
                // Automatically trigger the download of the QR code
                downloadQRCode("{{ download_data }}");
            </script>
        </div>
        {% endif %}
    </div>
    <footer>
        &copy;  Saniya Sayyed All rights reserved.<br>
        Linkedin URL:https://github.com/Saniya2218
    </footer>
  
</body>
</html>
